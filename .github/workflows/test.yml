name: Tests

on:
  push:
    branches: [ main, master, migration/v3 ]
  pull_request:
    branches: [ main, master, migration/v3 ]
  workflow_dispatch:

jobs:
  web-tests:
    name: Web Frontend Build & Type Check (Vue/Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Web App
        working-directory: ./web
        run: npm run build

  server-tests:
    name: Server Build & Tests (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore server/tests/Cinegram.Tests/Cinegram.Tests.csproj

      - name: Build Server
        run: dotnet build server/src/Cinegram.csproj --configuration Release

      - name: Run Tests
        run: dotnet test server/tests/Cinegram.Tests/Cinegram.Tests.csproj --configuration Release
