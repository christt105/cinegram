name: cinegram

services:
  cinegram:
    image: ghcr.io/christt105/cinegram:${CINEGRAM_TAG:-latest}
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-5173}:8080"
    volumes:
      - ./appdata/bot-net:/data
      - ./appdata/backend:/data/db
      - ${MEDIA_ROOT:?set MEDIA_ROOT in .env}:/data/media
      - ${JELLYFIN_APPDATA_ROOT:-./appdata/.jellyfin-appdata-unset}:/data/jellyfin-appdata:ro
    environment:
      - JELLYFIN_MOVIES_DIR=/data/media/${MOVIES_SUBDIR:-movies}
      - JELLYFIN_SHOWS_DIR=/data/media/${SHOWS_SUBDIR:-shows}
      - DOWNLOADS_DIR=/data/media/${DOWNLOADS_SUBDIR:-downloads}
